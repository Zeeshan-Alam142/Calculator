<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<link rel="stylesheet" href="project2.css">
<body>
    <div class="bg">
        <h1>Calculator</h1>
        <div class="calculator">
        <input type="text" id="display" placeholder="00.00" readonly>
        <div class="but">
            <button onclick="cd = '';document.querySelector('#display').value = cd;">C</button>
            <button onclick="cd += '1';document.querySelector('#display').value = cd;">1</button>
            <button onclick="cd += '2';document.querySelector('#display').value = cd;">2</button>
            
        </div>
        <div class="but">
            <button onclick="cd += '+';document.querySelector('#display').value = cd;">+</button>
            <button onclick="cd += '3';document.querySelector('#display').value = cd;">3</button>
            <button onclick="cd += '4';document.querySelector('#display').value = cd;">4</button>
            
        </div>
        <div class="but">
            <button onclick="cd += '-';document.querySelector('#display').value = cd;">-</button>
            <button onclick="cd += '5';document.querySelector('#display').value = cd;">5</button>
            <button onclick="cd += '6';document.querySelector('#display').value = cd;">6</button>
            
        </div>
        <div class="but">
            <button onclick="cd += 'X';document.querySelector('#display').value = cd;">X</button>
            <button onclick="cd += '7';document.querySelector('#display').value = cd;">7</button>
            <button onclick="cd += '8';document.querySelector('#display').value = cd;">8</button>
            
        </div>
        <div class="but">
            <button onclick="cd += '/';document.querySelector('#display').value = cd;">/</button>
            <button onclick="cd = eval(cd);document.querySelector('#display').value = cd;">=</button>
            <button onclick="cd += '9';document.querySelector('#display').value = cd;">9</button>
            
        </div>
        <div class="but">
            <button onclick="cd += '0';document.querySelector('#display').value = cd;">0</button>
            <button onclick="cd += '.';document.querySelector('#display').value = cd;">.</button>
            
            
        </div>
    </div>
    </div>
    <script src="project.js"></script>
</body>
</html>
