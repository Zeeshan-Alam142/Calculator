<!DOCTYPE html>
<html lang="en">
<head>
    <title>javascript</title>
    <link rel="stylesheet" href="project2.css">
    
</head>
<body>
    <div id="calculator">
        <div id="display">
            <input type="text" name="" id="display1" placeholder="00.00">
        </div>
        <div id="row">
            <button id="wer" onclick="
            currentDisplay = '';
            document.querySelector('#display1').value = currentDisplay;">C</button>
            <button  id="wer1" onclick="
            currentDisplay += '1';
            document.querySelector('#display1').value = currentDisplay;">1</button>
            <button  id="wer1" onclick="
            currentDisplay += '2';
            document.querySelector('#display1').value = currentDisplay;">2</button>
        </div>
        <div id="row">
            <button  id="wer" onclick="
            currentDisplay += '+';
            document.querySelector('#display1').value = currentDisplay;">+</button>
            <button id="wer1"  onclick="
            currentDisplay += '3';
            document.querySelector('#display1').value = currentDisplay;">3</button>
            <button  id="wer1" onclick="
            currentDisplay += '4';
            document.querySelector('#display1').value = currentDisplay;">4</button>
        </div>
        <div id="row">
            <button  id="wer" onclick="
            currentDisplay += '-';
            document.querySelector('#display1').value = currentDisplay;">-</button>
            <button  id="wer1" onclick="
            currentDisplay += '5';
            document.querySelector('#display1').value = currentDisplay;">5</button>
            <button  id="wer1" onclick="
            currentDisplay += '6';
            document.querySelector('#display1').value = currentDisplay;">6</button>
        </div>
        <div id="row">
            <button  id="wer" onclick="
            currentDisplay += '*';
            document.querySelector('#display1').value = currentDisplay;">x</button>
            <button  id="wer1" onclick="
            currentDisplay += '7';
            document.querySelector('#display1').value = currentDisplay;">7</button>
            <button  id="wer1" onclick="
            currentDisplay += '8';
            document.querySelector('#display1').value = currentDisplay;">8</button>
        </div>
        <div id="row">
            <button  id="wer" onclick="
            currentDisplay += '/';
            document.querySelector('#display1').value = currentDisplay;">/</button>
            <button  id="wer2" style="color: rgb(7, 7, 7);
    background-color: rgb(0, 253, 0);" onclick="
            currentDisplay = eval(currentDisplay);
            document.querySelector('#display1').value = currentDisplay;">=</button>
            <button  id="wer1" onclick="
            currentDisplay += '9';
            document.querySelector('#display1').value = currentDisplay;">9</button>
        </div>
        <div id="row">
            <button  id="wer3" onclick="
            currentDisplay += '0';
            document.querySelector('#display1').value = currentDisplay;">0</button>
            <button  style="color: rgb(7, 7, 7);
    background-color: rgb(0, 253, 0);" id="wer1" onclick="
            currentDisplay += '.';
            document.querySelector('#display1').value = currentDisplay;">.</button>
        </div>
    </div>
   <script>
        let currentDisplay = '';
        document.querySelector('#display1').value = currentDisplay;



   </script>
</body>
</html>
